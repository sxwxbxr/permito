<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Permito Vite Beispiel</title>
    <!-- Google Consent Mode v2 default: everything denied until the visitor decides. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      // biome-ignore lint/complexity/noArguments: gtag.js requires the arguments object
      function gtag() { window.dataLayer.push(arguments); }
      gtag("consent", "default", {
        ad_storage: "denied", ad_user_data: "denied", ad_personalization: "denied",
        analytics_storage: "denied", functionality_storage: "denied",
        personalization_storage: "denied", security_storage: "granted", wait_for_update: 500
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Markup-based blocking: activated by <PermitoProvider blockedElements> after consent. -->
    <script type="text/plain" data-consent-category="statistics">
      console.log("[example] statistics script ran");
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
